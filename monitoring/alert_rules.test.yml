# Unit tests for monitoring/alert_rules.yml — run with:
#   docker run --rm -v "$PWD/monitoring:/m:ro" --entrypoint promtool prom/prometheus:v3.15.0 \
#     test rules /m/alert_rules.test.yml
# (from the repository root). The CI quality job runs the same command.
#
# These tests are the "test alert fired once" evidence the operations audit
# asks for: the rules are exercised against synthetic series and both the
# firing path and the quiet path are asserted.
rule_files:
  - alert_rules.yml
evaluation_interval: 1m

tests:
  # A 50% 5xx ratio sustained past the `for: 5m` window fires High5xxRate.
  - interval: 1m
    input_series:
      - series: 'agrobridge_http_requests_total{status="500"}'
        values: '0+1x10'
      - series: 'agrobridge_http_requests_total{status="200"}'
        values: '0+1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: High5xxRate
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "API 5xx rate above 5% for 5 minutes"
              description: 'Error ratio 50% over the last 5m. Check API logs by requestId and recent deploys.'
              runbook: docs/operations.md

  # A healthy deployment fires nothing. The auth series is present and BELOW
  # the threshold on purpose: one refused request a minute is a person
  # mistyping a password, not an incident (F-27's quiet case).
  - interval: 1m
    input_series:
      - series: 'agobridge_http_requests_total{status="200"}'
        values: '0+10x10'
      - series: 'agobridge_db_up'
        values: '1+0x10'
      - series: 'agobridge_auth_failures_total{route="/api/v1/auth/login",reason="invalid_credentials"}'
        values: '0+1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: High5xxRate
        exp_alerts: []
      - eval_time: 10m
        alertname: DbDown
        exp_alerts: []
      - eval_time: 10m
        alertname: PaymentFailures
        exp_alerts: []
      - eval_time: 10m
        alertname: AuthFailureSpike
        exp_alerts: []


  # The database gauge stuck at 0 past `for: 2m` fires DbDown.
  - interval: 1m
    input_series:
      - series: 'agrobridge_db_up'
        values: '1 1 0+0x8'
    alert_rule_test:
      - eval_time: 6m
        alertname: DbDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Database unreachable (/ready failing)"
              description: 'agrobridge_db_up has been 0 for 2m. See docs/runbooks/chaos-drills.md and disaster-recovery restore procedure.'
              runbook: docs/runbooks/failed-transaction-recovery.md

  # Firing paths for the remaining rules. The cold read found only two of six
  # rules had one, so a critical alert watching a never-emitted label could not
  # be caught. PaymentFailures now watches a series the API actually
  # increments (reconcileLiveVerdict's FAILED branch).
  - interval: 1m
    input_series:
      - series: 'agrobridge_payment_intents_total{purpose_type="ORDER",status="failed"}'
        values: '0+1x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: PaymentFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              purpose_type: "ORDER"
              status: "failed"
            exp_annotations:
              summary: "More than 5 failed payment intents in 10 minutes"
              description: "Check SSLCommerz gateway status and PAYMENT_PROVIDER sandbox/live labelling before user complaints arrive."
              runbook: docs/runbooks/failed-transaction-recovery.md

  - interval: 1m
    input_series:
      - series: 'agrobridge_ai_requests_total{provider="offline-agro-engine",status="fallback_success"}'
        values: '0+2x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: AiFallbackSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: "offline-agro-engine"
              status: "fallback_success"
            exp_annotations:
              summary: "AI provider falling back to offline engine (>10 in 15m)"
              description: "Advisories still answer via the grounded offline KB engine, but check provider quota/keys."
              runbook: docs/runbooks/provider-outage.md

  - interval: 1m
    input_series:
      - series: 'up{instance="api:4000",job="agrobridge"}'
        values: '1 1 1 0+0x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: "api:4000"
              job: "agrobridge"
            exp_annotations:
              summary: "Scrape target down"
              description: "Prometheus cannot reach api:4000 for 3m. Container may be crashed or network partitioned."
              runbook: docs/runbooks/live-deployment.md

  # F-27: a 401/403 burst on one route+reason fires AuthFailureSpike. 60 refused
  # requests a minute (1/s) on /auth/login with reason invalid_credentials goes
  # pending at t+1m — once the 5m rate window has two samples — and fires after
  # `for: 10m`. The API does not emit this metric yet (see the rule's comment);
  # the series here is synthetic, exactly as the other rules are exercised.
  - interval: 1m
    input_series:
      - series: 'agobridge_auth_failures_total{route="/api/v1/auth/login",reason="invalid_credentials"}'
        values: '0+60x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: AuthFailureSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              route: "/api/v1/auth/login"
              reason: "invalid_credentials"
            exp_annotations:
              summary: "Sustained 401/403 rate on one route (>0.1/s for 10m)"
              description: "/api/v1/auth/login is refusing requests with reason invalid_credentials. Check the API logs for that reason and recent RBAC or session changes before it becomes a lockout; a mass 401 after a deploy is usually JWT-secret rotation (docs/runbooks/secret-rotation.md)."
              runbook: docs/operations.md
