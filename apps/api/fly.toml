app = "agrobridge-api"
primary_region = "ord"
kill_signal = "SIGINT"
kill_timeout = 30

[build]
  dockerfile = "docker/api.Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  WEATHER_PROVIDER = "mock"
  AI_PROVIDER = "offline"
  PAYMENT_PROVIDER = "sandbox"
  CORS_ORIGINS = "https://agrobridge-web.vercel.app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "get"
    path = "/health"
    timeout = "5s"