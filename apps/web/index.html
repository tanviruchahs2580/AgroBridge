<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#166534" />
    <meta name="description" content="AgroBridge — কৃষকের ডিজিটাল সঙ্গী। AI কৃষকের হাতে।" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="maskable" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Self-hosted Hind Siliguri + Noto Sans Bengali (offline-safe, no Google
         CSS dependency). Preload exactly the faces the first paint needs: the
         body weight (bengali-400) and the heading face the login hero maps to
         (font-extrabold 800 resolves to the 700 file — there is no 800 face),
         plus the small Latin 400 for numerals. Noto Sans Bengali is the
         fallback family in the stack, not a first-paint face: preloading its
         107 kB pulled a font most sessions never render, and the Lighthouse
         LCP budget caught it. It still loads on demand when a glyph needs it. -->
    <link rel="preload" href="/fonts/hind-siliguri-bengali-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/hind-siliguri-bengali-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/hind-siliguri-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AgroBridge" />
    <title>AgroBridge — AI কৃষকের হাতে</title>
    <!-- Theme boot: apply the persisted (or OS) theme before first paint so a
         dark-mode reload never flashes light. Mirrors lib/session.tsx logic.

         Deliberately inline: an external file would be a render-blocking round
         trip before first paint on exactly the slow connections this app targets.
         A strict CSP therefore allowlists this exact script by hash, and
         `scripts/preflight.mjs` recomputes that hash from the built HTML and fails
         if this script and the CSP ever disagree. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("agro_dark_mode") ?? sessionStorage.getItem("agro_dark_mode");
          var dark = stored !== null ? stored === "true" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body class="bg-surface-bg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
