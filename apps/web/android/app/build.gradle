apply plugin: 'com.android.application'

// ── App version: one source of truth (repo-root version.json) ───────────────
// The web bundle reads the same file at build time (apps/web/vite.config.ts),
// so the APK/AAB versionName and the shipped bundle can never disagree.
// `-PversionCode=… -PversionName=…` override it (used by CI release builds).
def appVersionCode = (project.findProperty("versionCode") ?: "1") as Integer
def appVersionName = (project.findProperty("versionName") ?: "0.0.0") as String
def repoVersionFile = rootProject.file("../../../version.json")
if (repoVersionFile.exists()) {
    try {
        def repoVersion = new groovy.json.JsonSlurper().parse(repoVersionFile)
        if (!project.hasProperty("versionCode") && repoVersion.versionCode) {
            appVersionCode = repoVersion.versionCode as Integer
        }
        if (!project.hasProperty("versionName") && repoVersion.version) {
            appVersionName = repoVersion.version as String
        }
    } catch (Exception e) {
        logger.warn("version.json present but unreadable (${e.message}); using ${appVersionName} (${appVersionCode})")
    }
} else {
    logger.warn("version.json not found at ${repoVersionFile}; using ${appVersionName} (${appVersionCode})")
}

// ── Release signing ────────────────────────────────────────────────────────
// Keystore config lives in key.properties (git-ignored). Both the android
// project root (android/key.properties) and the app module (android/app/
// key.properties) are accepted so either documented layout works.
// Generate: keytool -genkeypair -v -keystore agrobridge-release.keystore -alias agrobridge -keyalg RSA -keysize 2048 -validity 10000
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = file("key.properties")
}
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.agrobridge.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.agrobridge.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Files and dirs to omit from the packaged assets dir (the modern
        // replacement for the deprecated aaptOptions block).
        androidResources {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Sign only with the real upload key. There is deliberately NO
            // fallback to debug signing: an artifact signed with the debug key
            // is rejected by Play, and silently producing one hides the
            // misconfiguration until submission. Without key.properties this
            // build type produces an UNSIGNED artifact instead — use
            // `assembleDebug` for local testing.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
