version: 2
updates:
  # npm workspaces (root covers all workspace packages)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # docker/ holds the api + web Dockerfiles and the compose pull chain
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
