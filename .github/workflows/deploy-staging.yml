# ⚠️ STAGING SCAFFOLD — fill secrets before use.
# Required GitHub secrets before this workflow will work:
#   STAGING_HOST      — VM hostname/IP
#   STAGING_USER      — SSH user with docker group membership
#   STAGING_SSH_KEY   — private key (PEM) of a deploy-only key
# Optional repo VARIABLE: STAGING_BASE_URL (defaults to the placeholder below).
#
# Deploys images built from this repo to the staging VM using docker-compose.prod.yml
# (see docs/deployment.md §5). Migrations stay manual by design — see echo hint in the deploy step.
#
# Rollback: every image is pushed with an immutable `sha-<commit>` tag beside its
# semver tag, so a bad release goes back by pinning the previous commit and
# re-running the stack — no rebuild, the old bytes are still in GHCR:
#   API_IMAGE_TAG=sha-<previous-commit> WEB_IMAGE_TAG=sha-<previous-commit> \
#     docker compose -f docker-compose.prod.yml up -d
# Migrations are forward-only: a rollback that crosses a migration needs its own
# plan, and the compose file applies none on boot.
name: Deploy Staging

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# One tag deploy at a time: two `v*` pushes racing would double-restart the stack.
concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: Build & push images to GHCR
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    # Docker buildx builds of two images: 30 min (docker class, see docker-build in ci.yml).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # pin v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # pin v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (api)
        id: meta-api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # pin v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/api
          tags: |
            type=sha
            type=semver,pattern={{version}}

      - name: Build & push api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # pin v7.4.0
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Extract metadata (web)
        id: meta-web
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # pin v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/web
          tags: |
            type=sha
            type=semver,pattern={{version}}

      - name: Build & push web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # pin v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

  deploy-staging:
    name: Deploy to staging VM
    needs: [build-push]
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    # Remote docker compose pull/up + two post-deploy gates: 30 min (docker class).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - name: Guard — staging secrets must be configured
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          missing=""
          [ -z "$STAGING_HOST" ]    && missing="$missing STAGING_HOST"
          [ -z "$STAGING_USER" ]    && missing="$missing STAGING_USER"
          [ -z "$STAGING_SSH_KEY" ] && missing="$missing STAGING_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secrets:$missing — this is a STAGING SCAFFOLD until filled."
            exit 1
          fi

      - name: Copy production compose file to VM
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # pin v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/agrobridge/
          overwrite: true

      - name: Pull & restart stack
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # pin v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ~/agrobridge
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            echo "NOTE: migrations are NOT applied on boot."
            echo "Apply manually if the release contains migrations:"
            echo "  docker compose -f docker-compose.prod.yml exec api npx prisma migrate deploy"

      - name: Post-deploy gate — health & readiness
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # pin v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ~/agrobridge
            # /health + /ready live at API root (not behind the /api proxy), so probe in-network.
            docker compose -f docker-compose.prod.yml exec -T api wget -qO- http://localhost:4000/health | grep -q ok
            docker compose -f docker-compose.prod.yml exec -T api wget -qO- http://localhost:4000/ready | grep -q '"db":true'
            echo "API health + readiness OK"

      - name: Post-deploy gate — public HTTPS reachability
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://staging.agro.example.com' }} # PLACEHOLDER domain
        run: |
          curl -fsS --max-time 15 "${STAGING_BASE_URL}/" | grep -q '<div id="root">'
          echo "Web OK at ${STAGING_BASE_URL}"
