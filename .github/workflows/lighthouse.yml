# Lighthouse CI gate for the built SPA (preview server on :4173).
# Manual trigger: depends on @lhci/cli being installed in apps/web and the
# lighthouserc.json assertions. Kept on workflow_dispatch (not push) so an
# unprovisioned LHCI config can never block the main CI gate.
name: lighthouse
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    # Headless Chrome runs + a production build: 30 min (same class as web-e2e).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with: { node-version: 22 }
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # pin v12
        with:
          configPath: ./apps/web/lighthouserc.json
