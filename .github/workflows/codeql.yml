name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly, Mondays

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # pin v4 -> replace tag with full commit SHA before production

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3 # pin v3 -> commit SHA
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3 # pin v3 -> commit SHA

      - name: Perform CodeQL Analysis (uploads SARIF to code scanning)
        uses: github/codeql-action/analyze@v3 # pin v3 -> commit SHA
        with:
          category: "/language:javascript-typescript"
          output: "${{ runner.temp }}/codeql-results"
