# Signed Android release build (Capacitor).
# Keystore and key.properties are NEVER committed — .gitignore already excludes them.
# Required GitHub repo secrets (see docs/android-release.md):
#   ANDROID_KEYSTORE_BASE64 | KEYSTORE_PASSWORD | KEY_ALIAS | KEY_PASSWORD
on:
  workflow_dispatch:

jobs:
  signed-release:
    name: Signed AAB + release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin v4 -> commit SHA

      - name: Fail fast if signing secrets are absent
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ]       && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]               && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]            && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "Keystore generation + base64 encoding instructions: docs/android-release.md"
            exit 1
          fi

      - uses: actions/setup-java@v4 # pin v4 -> commit SHA
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v7 # pin v4 -> commit SHA
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --workspace @agrobridge/web --include-workspace-root --no-audit --no-fund

      - name: Build PWA bundle
        working-directory: apps/web
        run: npm run build

      - name: Decode keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: apps/web/android/app
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > agrobridge-release.keystore.jks

      - name: Write key.properties (git-ignored)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: apps/web/android/app
        run: |
          cat > key.properties <<EOF
          storeFile=agrobridge-release.keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Sync Capacitor android platform
        working-directory: apps/web
        run: npx cap sync android

      - name: Build signed AAB + APK
        working-directory: apps/web/android
        run: chmod +x gradlew && ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload AAB artifact (Play Store)
        uses: actions/upload-artifact@v4 # pin v4 -> commit SHA
        with:
          name: agrobridge-release-aab
          path: apps/web/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK artifact (direct install)
        uses: actions/upload-artifact@v4 # pin v4 -> commit SHA
        with:
          name: agrobridge-release-apk
          path: apps/web/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
