name: Android — Release (signed AAB)

# Signed Android release build (Capacitor).
# Keystore and key.properties are NEVER committed — .gitignore already excludes them.
# Required GitHub repo secrets (see docs/android-release.md):
#   ANDROID_KEYSTORE_BASE64 | KEYSTORE_PASSWORD | KEY_ALIAS | KEY_PASSWORD
on:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  signed-release:
    name: Signed AAB + release APK
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          # The versionCode preflight below compares against the newest v* tag.
          fetch-depth: 0

      - name: Fail fast if signing secrets are absent
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ]       && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]               && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]            && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "Keystore generation + base64 encoding instructions: docs/android-release.md"
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # pin v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version: 22
          cache: npm

      # Play rejects a versionCode that was ever used, and version.json is
      # hand-bumped next to the version string (docs/play/release-runbook.md).
      # Fail here, before 45 minutes of build, rather than at upload time.
      - name: versionCode preflight (must exceed the newest release tag)
        run: node scripts/qa/check-versioncode.mjs

      - name: Install dependencies
        run: npm ci --workspace @agrobridge/web --include-workspace-root --no-audit --no-fund

      - name: Build PWA bundle
        working-directory: apps/web
        run: npm run build

      - name: Decode keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: apps/web/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > agrobridge-release.keystore.jks

      - name: Write key.properties (git-ignored)
        # apps/web/android/ is where app/build.gradle looks first (rootProject.file).
        # The app module path also works, but keep one canonical location.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: apps/web/android
        run: |
          cat > key.properties <<EOF
          storeFile=agrobridge-release.keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Read app version (single source of truth)
        id: appversion
        run: |
          VERSION=$(node -p "require('./version.json').version")
          CODE=$(node -p "require('./version.json').versionCode")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE"         >> "$GITHUB_OUTPUT"
          echo "Building AgroBridge $VERSION (versionCode $CODE)"

      - name: Sync Capacitor android platform
        working-directory: apps/web
        run: npx cap sync android

      - name: Verify the synced bundle matches the build
        # The Android project ships whatever is in app/src/main/assets/public, so
        # a missing/failed `cap sync` would silently publish an old web app. The
        # version.json emitted by the web build makes that checkable.
        run: |
          set -euo pipefail
          SYNCED="apps/web/android/app/src/main/assets/public/version.json"
          test -f "$SYNCED" || { echo "::error::$SYNCED missing — cap sync did not copy the bundle"; exit 1; }
          SYNCED_VERSION=$(node -p "require('./${SYNCED}').version")
          EXPECTED="${{ steps.appversion.outputs.version }}"
          if [ "$SYNCED_VERSION" != "$EXPECTED" ]; then
            echo "::error::synced web bundle is $SYNCED_VERSION but version.json says $EXPECTED — stale assets"
            exit 1
          fi
          echo "Synced bundle version $SYNCED_VERSION matches version.json"

      - name: Build signed AAB + APK
        working-directory: apps/web/android
        run: chmod +x gradlew && ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Verify the artifacts are signed with the upload key
        # Without this the workflow would happily upload an unsigned or
        # debug-signed artifact and the failure would only surface in the Play
        # Console. Both artifacts must carry a real signature.
        run: |
          set -euo pipefail
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner not found in the runner SDK"; exit 1; fi
          APK="apps/web/android/app/build/outputs/apk/release/app-release.apk"
          AAB="apps/web/android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK" || { echo "::error::$APK missing"; exit 1; }
          test -f "$AAB" || { echo "::error::$AAB missing"; exit 1; }

          echo "--- APK signer ---"
          "$APKSIGNER" verify --print-certs "$APK" | tee apk-certs.txt
          if grep -qi "CN=Android Debug" apk-certs.txt; then
            echo "::error::the release APK is debug-signed; Play will reject it"
            exit 1
          fi

          echo "--- AAB signature ---"
          # The bundle is JAR-signed (v1), so jarsigner reads it — apksigner does
          # not. -strict fails on any unsigned entry, which the old META-INF
          # listing could not see: a partially-signed bundle passed that check.
          jarsigner -verify -strict -certs "$AAB" | tee aab-certs.txt
          if grep -qi "CN=Android Debug" aab-certs.txt; then
            echo "::error::the release AAB is debug-signed; Play will reject it"
            exit 1
          fi
          echo "Signature verification passed"

      - name: Upload AAB artifact (Play Store)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin v7.0.1
        with:
          name: agrobridge-release-aab
          path: apps/web/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK artifact (direct install)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin v7.0.1
        with:
          name: agrobridge-release-apk
          path: apps/web/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
