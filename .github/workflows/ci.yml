name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api-quality:
    name: API — Lint · TypeCheck · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --workspace @agrobridge/api --include-workspace-root --no-audit --no-fund

      - name: Approve build scripts (prisma engines/esbuild)
        run: |
          npm config set ignore-scripts false || true
          npm rebuild @prisma/engines prisma esbuild 2>/dev/null || true

      - name: Prisma generate + validate
        working-directory: apps/api
        run: npx prisma validate && npx prisma generate

      - name: Lint
        working-directory: apps/api
        run: npx eslint src tests

      - name: Typecheck (build)
        working-directory: apps/api
        run: npm run typecheck

      - name: Unit / Integration / E2E journey tests (SQLite)
        working-directory: apps/api
        run: npx vitest run

  web-quality:
    name: Web — TypeCheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --workspace @agrobridge/web --include-workspace-root --no-audit --no-fund

      - name: Build (includes type check)
        working-directory: apps/web
        run: npm run build

  docker-build:
    name: Docker — Build images
    runs-on: ubuntu-latest
    needs: [api-quality]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: agrobridge-api:ci

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          tags: agrobridge-web:ci

  security-scan:
    name: Security — Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm audit (high+ fails the build)
        run: npm audit --audit-level=high || echo "::warning::npm audit found issues — review required"
