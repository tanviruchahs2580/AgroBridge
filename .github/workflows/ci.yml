name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede outdated runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN (CodeQL manages its own via codeql.yml).
permissions:
  contents: read

# Workflow-wide: every npm invocation below runs with the install-script
# allow-list enforced. `allowScripts` in package.json is an npm 11 surface, so
# this variable only bites once the runner's npm is pinned to the version
# package.json declares — each job does that in the step right after
# actions/setup-node (F-88). Verified on npm 11.17.0: with this set, a package
# with an install script that is NOT in allowScripts fails the install
# (ESTRICTALLOWSCRIPTS) instead of silently running it.
env:
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"

jobs:
  api-quality:
    name: API — Lint · TypeCheck · Tests (SQLite)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    env:
      DATABASE_URL: "file:./test.db"
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210
      # A browser suite signs in far more often than a person and the login limit
      # is per IP; the default (20/15min) is the production policy and is still
      # exercised by the API test suite. This instance is ephemeral.
      LOGIN_RATE_LIMIT_MAX: "500"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # F-88 — why CI installs its own npm instead of using the one Node 22
      # bundles: the install-script allow-list (`allowScripts` in package.json)
      # is an npm 11 surface, and npm 10 runs EVERY dependency install script
      # regardless of the list. Pinning the runner to the version package.json
      # declares is what makes NPM_CONFIG_STRICT_ALLOW_SCRIPTS (workflow env)
      # a gate rather than a no-op, and it means CI and a developer's machine
      # resolve dependencies with the same toolchain. The version comes from
      # package.json — there is no second copy to drift. The same step appears
      # in every job that installs dependencies, and in the Android workflows.
      - name: Pin npm to the package.json packageManager version
        run: |
          set -euo pipefail
          want=$(node -p "require('./package.json').packageManager")
          case "$want" in npm@*) ;; *) echo "::error::package.json has no npm packageManager pin (got: $want)"; exit 1 ;; esac
          npm install --global "$want"
          test "npm@$(npm --version)" = "$want" || { echo "::error::npm pin did not take effect: wanted $want, got npm@$(npm --version)"; exit 1; }
          echo "npm is $want"

      - name: Install dependencies
        run: npm ci --workspace @agrobridge/api --include-workspace-root --no-audit --no-fund

      # Install scripts must run for the approved packages, and only for those:
      # `NPM_CONFIG_STRICT_ALLOW_SCRIPTS` (workflow env) makes an unlisted
      # package's script fail the install, and this step then asserts the
      # approved ones actually completed. It used to read
      # `npm config set ignore-scripts false || true` followed by
      # `npm rebuild @prisma/engines prisma esbuild 2>/dev/null || true` — a
      # step that could not fail, carrying a second hard-coded copy of the list
      # (F-88). The list now comes from package.json `allowScripts`, so a
      # missing Prisma engine fails here instead of as an unexplained failure
      # several steps later.
      - name: Assert the approved install scripts ran (allowScripts)
        run: |
          set -euo pipefail
          test "$(npm config get ignore-scripts)" = "false" \
            || { echo "::error::ignore-scripts is not false — dependency install scripts would be skipped"; exit 1; }
          pkgs=$(node -e 'const a=require("./package.json").allowScripts||{};const n=[...new Set(Object.keys(a).map(k=>k.slice(0,k.lastIndexOf("@"))))].sort();if(!n.length){console.error("package.json allowScripts is empty — refusing an unbounded rebuild");process.exit(1)}process.stdout.write(n.join(" "))')
          echo "Approved install-script packages: $pkgs"
          npm rebuild $pkgs
          echo "approved install scripts completed"

      - name: Prisma generate + validate
        working-directory: apps/api
        run: npx prisma validate && npx prisma generate

      - name: Lint
        working-directory: apps/api
        run: npx eslint src tests

      - name: Typecheck (build)
        working-directory: apps/api
        run: npm run typecheck

      - name: Unit / Integration / E2E journeys with coverage gate (SQLite)
        working-directory: apps/api
        run: npx vitest run --coverage

      - name: Validate PostgreSQL schema variant
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://agrobridge:ci-password@localhost:5432/agrobridge
        run: npx prisma validate --schema prisma/schema.postgresql.prisma

  # Dependency/dead-code/duplication/licence/migration-drift gates (CID-06, SLP-02).
  # Each threshold sits at the measured baseline with a document ratchet: knip
  # findings are gated through scripts/knip-gate.mjs (reviewed baseline + reasons),
  # jscpd fails above 3% (measured 0.66% — 156 duplicated lines in 134 files on
  # 2026-11-10, `npx jscpd --silent --threshold 3 apps/api/src apps/web/src`; the
  # number this comment carried before was 2.47%), the licence allow-list is
  # scripts/licence-allowlist.json, and the migration chain must reproduce the
  # schema with zero drift (scripts/drift-check.mjs).
  quality-gates:
    name: Quality gates — knip / jscpd / licences / commitlint / migration drift
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          # commitlint checks the commit range, not just the checkout SHA
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # F-88 — why CI installs its own npm instead of using the one Node 22
      # bundles: the install-script allow-list (`allowScripts` in package.json)
      # is an npm 11 surface, and npm 10 runs EVERY dependency install script
      # regardless of the list. Pinning the runner to the version package.json
      # declares is what makes NPM_CONFIG_STRICT_ALLOW_SCRIPTS (workflow env)
      # a gate rather than a no-op, and it means CI and a developer's machine
      # resolve dependencies with the same toolchain. The version comes from
      # package.json — there is no second copy to drift. The same step appears
      # in every job that installs dependencies, and in the Android workflows.
      - name: Pin npm to the package.json packageManager version
        run: |
          set -euo pipefail
          want=$(node -p "require('./package.json').packageManager")
          case "$want" in npm@*) ;; *) echo "::error::package.json has no npm packageManager pin (got: $want)"; exit 1 ;; esac
          npm install --global "$want"
          test "npm@$(npm --version)" = "$want" || { echo "::error::npm pin did not take effect: wanted $want, got npm@$(npm --version)"; exit 1; }
          echo "npm is $want"
      - run: npm ci
      - name: knip (dead files, unused deps, unlisted)
        run: node scripts/knip-gate.mjs
      - name: jscpd duplication <= 3%
        run: npx jscpd --silent --threshold 3 apps/api/src apps/web/src
      - name: licence allow-list
        run: node scripts/licence-gate.mjs
      # Lint every commit the change introduces, not just the tip: with
      # `--from=HEAD~1` a multi-commit branch carried malformed messages as long
      # as its last commit was well-formed (AUD-110). The base is the PR's base
      # on a pull request, or the pushed-from commit on a branch update; a new
      # branch (all-zero `before`) or an unknown base falls back to the tip.
      - name: commitlint (whole change range)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && ! printf '%s' "$BASE_SHA" | grep -qE '^0+$' && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            FROM=$(git merge-base "$BASE_SHA" HEAD)
          else
            FROM=HEAD~1
          fi
          echo "commitlint range: $FROM..HEAD"
          npx commitlint --from="$FROM" --to=HEAD
      - name: migration drift
        run: node scripts/drift-check.mjs
      - name: no TODO/FIXME markers in shipped source
        run: node scripts/todo-gate.mjs
      # The release workflows run this before building an AAB (android-release.yml,
      # play-upload.yml); on a pull request nothing did, so a versionCode fork was
      # only discovered at upload time, when Play rejects the build. This job is
      # where it belongs: it is the one that fetches full tag history
      # (fetch-depth: 0), which the check needs to compare against the newest v* tag.
      - name: versionCode is monotonic vs the newest v* tag
        run: npm run qa:versioncode
      - name: eslint warning ratchet (api 143 / web 0)
        run: node scripts/qa/lint-budget.mjs
      - name: generated docs freshness (route matrix + ERD)
        run: |
          node apps/api/scripts/route-matrix.mjs --check
          node apps/api/scripts/gen-erd.mjs --check


  api-postgres:
    name: API — Integration & Concurrency (PostgreSQL 17)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 30
    services:
      postgres:
        # digest pinned: the tag is mutable and a retag would silently change
        # what every PostgreSQL gate runs against. postgres:17-alpine
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: agrobridge
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: agrobridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrobridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agrobridge:ci-password@localhost:5432/agrobridge
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # F-88 — why CI installs its own npm instead of using the one Node 22
      # bundles: the install-script allow-list (`allowScripts` in package.json)
      # is an npm 11 surface, and npm 10 runs EVERY dependency install script
      # regardless of the list. Pinning the runner to the version package.json
      # declares is what makes NPM_CONFIG_STRICT_ALLOW_SCRIPTS (workflow env)
      # a gate rather than a no-op, and it means CI and a developer's machine
      # resolve dependencies with the same toolchain. The version comes from
      # package.json — there is no second copy to drift. The same step appears
      # in every job that installs dependencies, and in the Android workflows.
      - name: Pin npm to the package.json packageManager version
        run: |
          set -euo pipefail
          want=$(node -p "require('./package.json').packageManager")
          case "$want" in npm@*) ;; *) echo "::error::package.json has no npm packageManager pin (got: $want)"; exit 1 ;; esac
          npm install --global "$want"
          test "npm@$(npm --version)" = "$want" || { echo "::error::npm pin did not take effect: wanted $want, got npm@$(npm --version)"; exit 1; }
          echo "npm is $want"

      - name: Install dependencies
        run: npm ci --workspace @agrobridge/api --include-workspace-root --no-audit --no-fund

      - name: Provision PostgreSQL (schema + client + seed)
        working-directory: apps/api
        run: node scripts/provision-postgres.mjs

      - name: Full suite incl. concurrency & security matrix on PostgreSQL
        working-directory: apps/api
        run: npx vitest run --config vitest.config.pg.ts

  # The shipping schema and its migration chain cannot diverge, and every
  # migration must apply to an empty database. `provision-postgres.mjs` applies
  # the chain (deploy is idempotent and on this fresh container the database is
  # empty), `migrate status` proves nothing is pending or failed, and
  # `migrate diff --from-migrations` proves the schema file and the chain that
  # ships beside it produce the same database. Without this a migration could
  # land uncommitted, edited after the fact, or missing from the chain, and the
  # first symptom would be a production database that does not match its schema.
  api-migration-drift:
    name: API — Migration chain vs schema (PostgreSQL 17)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 30
    services:
      postgres:
        # digest pinned: the tag is mutable and a retag would silently change
        # what every PostgreSQL gate runs against. postgres:17-alpine
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: agrobridge
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: agrobridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrobridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agrobridge:ci-password@localhost:5432/agrobridge
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # F-88 — why CI installs its own npm instead of using the one Node 22
      # bundles: the install-script allow-list (`allowScripts` in package.json)
      # is an npm 11 surface, and npm 10 runs EVERY dependency install script
      # regardless of the list. Pinning the runner to the version package.json
      # declares is what makes NPM_CONFIG_STRICT_ALLOW_SCRIPTS (workflow env)
      # a gate rather than a no-op, and it means CI and a developer's machine
      # resolve dependencies with the same toolchain. The version comes from
      # package.json — there is no second copy to drift. The same step appears
      # in every job that installs dependencies, and in the Android workflows.
      - name: Pin npm to the package.json packageManager version
        run: |
          set -euo pipefail
          want=$(node -p "require('./package.json').packageManager")
          case "$want" in npm@*) ;; *) echo "::error::package.json has no npm packageManager pin (got: $want)"; exit 1 ;; esac
          npm install --global "$want"
          test "npm@$(npm --version)" = "$want" || { echo "::error::npm pin did not take effect: wanted $want, got npm@$(npm --version)"; exit 1; }
          echo "npm is $want"

      - name: Install dependencies
        run: npm ci --workspace @agrobridge/api --include-workspace-root --no-audit --no-fund

      - name: Apply the migration chain to the empty database
        working-directory: apps/api
        run: node scripts/provision-postgres.mjs

      - name: Migration status (no pending or failed migrations)
        working-directory: apps/api
        run: npx prisma migrate status --schema prisma/postgres/schema.prisma

      # --exit-code: 0 when the diff is empty, 1 on error, 2 when the database
      # and the schema datamodel differ. The comparison is against the database
      # the chain just produced on this runner (--from-url), not a shadow
      # replay: that is exactly the production shape, and it needs no shadow
      # database (which does not exist on a fresh service container — P1003).
      - name: Schema and migration chain must not diverge
        working-directory: apps/api
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/postgres/schema.prisma \
            --exit-code

  web-quality:
    name: Web — Lint · Unit · Build
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    # 20 (was 25): the Lighthouse collections that justified the extra headroom
    # are gone (see the note above `Release preflight`). The remaining steps —
    # install, unit tests with coverage, build, preflight — sit near 8 minutes.
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: https://agro-bridge-api-vantiq-systems.vercel.app/api/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # F-88 — why CI installs its own npm instead of using the one Node 22
      # bundles: the install-script allow-list (`allowScripts` in package.json)
      # is an npm 11 surface, and npm 10 runs EVERY dependency install script
      # regardless of the list. Pinning the runner to the version package.json
      # declares is what makes NPM_CONFIG_STRICT_ALLOW_SCRIPTS (workflow env)
      # a gate rather than a no-op, and it means CI and a developer's machine
      # resolve dependencies with the same toolchain. The version comes from
      # package.json — there is no second copy to drift. The same step appears
      # in every job that installs dependencies, and in the Android workflows.
      - name: Pin npm to the package.json packageManager version
        run: |
          set -euo pipefail
          want=$(node -p "require('./package.json').packageManager")
          case "$want" in npm@*) ;; *) echo "::error::package.json has no npm packageManager pin (got: $want)"; exit 1 ;; esac
          npm install --global "$want"
          test "npm@$(npm --version)" = "$want" || { echo "::error::npm pin did not take effect: wanted $want, got npm@$(npm --version)"; exit 1; }
          echo "npm is $want"

      - name: Install dependencies
        run: npm ci --workspace @agrobridge/web --include-workspace-root --no-audit --no-fund

      # K-08: version.json is canonical; a release bump must touch every manifest.
      - name: Version consistency
        run: node scripts/check-versions.mjs

      # Docs drift silently: a moved file or a renamed page leaves links that
      # only break for the reader. Relative targets only — external URLs would
      # make this gate depend on other sites answering.
      - name: Docs link check (README + docs/)
        run: node scripts/qa/link-check.mjs

      # Prose claims drift the same way links do: a documented npm script that
      # was renamed, a version that forked, a test count pasted into the README.
      - name: Docs claims check (scripts, version source, count claims)
        run: node scripts/qa/claims-check.mjs

      # Alert rules get the same treatment as code: synthetic series prove both
      # the firing path and the quiet path (the audit's "test alert fired once").
      - name: Alert rules unit test (promtool)
        run: |
          docker run --rm -v "$PWD/monitoring:/m:ro" --entrypoint promtool \
            prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e \
            test rules /m/alert_rules.test.yml

      - name: Lint (eslint + jsx-a11y)
        working-directory: apps/web
        run: npm run lint

      - name: i18n dictionary check
        working-directory: apps/web
        run: npm run i18n:check

      - name: Unit tests (vitest, with coverage gate)
        working-directory: apps/web
        run: npm run test:unit -- --coverage

      - name: Build (includes type check)
        working-directory: apps/web
        run: npm run build

      # Runs against dist/ and both vercel.json files: the CSP hash of the inline
      # theme script, the API origin the bundle bakes into connect-src, the two
      # Vercel configs agreeing, and the performance budgets. Each of those fails
      # silently in production and cannot be seen from source alone.
      - name: Release preflight (CSP hash, API origin, budgets)
        working-directory: apps/web
        run: npm run preflight

      # Lighthouse is NOT run here, and that is the F-33 decision rather than an
      # omission (2026-11-10). The step that used to sit here carried
      # `continue-on-error: true`: on this runner family Chrome intermittently
      # never paints (NO_FCP, every collection NaN, retry included), so the
      # accessibility floor and the FCP/LCP/TBT/CLS assertions in
      # apps/web/lighthouserc.json could not fail a build — and with the
      # pessimistic aggregation the web stream added, a non-painting collection
      # now fails them *every* time, which would turn a required check flaky.
      #
      # Nothing that step claimed is ungated:
      #   · byte budgets (entry bundle, total JS/CSS gzip, fonts, images) are
      #     enforced by apps/web/scripts/preflight.mjs in the step above;
      #   · LCP/TBT/CLS/page weight under 4x CPU + Slow-4G are measured and
      #     enforced by apps/web/e2e/perf-throttled.spec.ts in the required
      #     `Web — E2E (Playwright)` job;
      #   · accessibility is axe-checked by apps/web/e2e/a11y.spec.ts in that
      #     same required job;
      #   · lighthouserc.json itself stays gated: preflight.mjs fails if a numeric
      #     assertion loses `aggregationMethod: "pessimistic"` (and
      #     apps/web/src/config-invariants.test.ts asserts the same).
      # When a Lighthouse number is wanted for the record, run
      # `npx @lhci/cli@0.15.1 autorun` from apps/web against a preview build on
      # :4173; that is a measurement, not a gate.

  web-e2e:
    name: Web — E2E (Playwright)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    # 45 (not 30): the job now runs the suite twice — dev server and production
    # build — plus the Firefox/WebKit smoke specs.
    timeout-minutes: 45
    env:
      DATABASE_URL: "file:./test.db"
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210
      # A browser suite makes far more requests and sign-ins than a person; the
      # default production policies (300 req / 20 logins per 15 min / IP) sit
      # close enough to the suite's own volume that a second local run against
      # the same server exhausted them and failed unrelated tests (AUD-134).
      # This runner instance is ephemeral; the policy limits stay exercised by
      # the API suites.
      RATE_LIMIT_MAX: "2000"
      LOGIN_RATE_LIMIT_MAX: "500"
      # The suite runs twice in this job (dev pass, then the production-build
      # pass). playwright.config.ts defaults reuseExistingServer to false (F-42 —
      # locally 5173 is shared with a sibling project, and reuse would silently
      # test the wrong app), but the first pass's `npm run dev` grandchild can
      # outlive Playwright's teardown on the runner and hold the port, which made
      # the second pass fail with "already used". This job owns the port: reuse
      # is the correct behaviour here, and it is the escape hatch the config
      # documents — a local run without this variable still refuses to reuse.
      PLAYWRIGHT_REUSE_SERVER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # F-88 — why CI installs its own npm instead of using the one Node 22
      # bundles: the install-script allow-list (`allowScripts` in package.json)
      # is an npm 11 surface, and npm 10 runs EVERY dependency install script
      # regardless of the list. Pinning the runner to the version package.json
      # declares is what makes NPM_CONFIG_STRICT_ALLOW_SCRIPTS (workflow env)
      # a gate rather than a no-op, and it means CI and a developer's machine
      # resolve dependencies with the same toolchain. The version comes from
      # package.json — there is no second copy to drift. The same step appears
      # in every job that installs dependencies, and in the Android workflows.
      - name: Pin npm to the package.json packageManager version
        run: |
          set -euo pipefail
          want=$(node -p "require('./package.json').packageManager")
          case "$want" in npm@*) ;; *) echo "::error::package.json has no npm packageManager pin (got: $want)"; exit 1 ;; esac
          npm install --global "$want"
          test "npm@$(npm --version)" = "$want" || { echo "::error::npm pin did not take effect: wanted $want, got npm@$(npm --version)"; exit 1; }
          echo "npm is $want"

      - name: Install dependencies (all workspaces)
        run: npm ci --include-workspace-root --no-audit --no-fund

      # Install scripts must run for the approved packages, and only for those:
      # `NPM_CONFIG_STRICT_ALLOW_SCRIPTS` (workflow env) makes an unlisted
      # package's script fail the install, and this step then asserts the
      # approved ones actually completed. It used to read
      # `npm config set ignore-scripts false || true` followed by
      # `npm rebuild @prisma/engines prisma esbuild 2>/dev/null || true` — a
      # step that could not fail, carrying a second hard-coded copy of the list
      # (F-88). The list now comes from package.json `allowScripts`, so a
      # missing Prisma engine fails here instead of as an unexplained failure
      # several steps later.
      - name: Assert the approved install scripts ran (allowScripts)
        run: |
          set -euo pipefail
          test "$(npm config get ignore-scripts)" = "false" \
            || { echo "::error::ignore-scripts is not false — dependency install scripts would be skipped"; exit 1; }
          pkgs=$(node -e 'const a=require("./package.json").allowScripts||{};const n=[...new Set(Object.keys(a).map(k=>k.slice(0,k.lastIndexOf("@"))))].sort();if(!n.length){console.error("package.json allowScripts is empty — refusing an unbounded rebuild");process.exit(1)}process.stdout.write(n.join(" "))')
          echo "Approved install-script packages: $pkgs"
          npm rebuild $pkgs
          echo "approved install scripts completed"

      # WebKit and Firefox run only the two smoke specs (see the projects in
      # apps/web/playwright.config.ts); chromium owns the full suite.
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Provision seeded SQLite database + API client
        working-directory: apps/api
        run: |
          npx prisma generate --schema prisma/schema.prisma
          npx prisma migrate deploy
          npx prisma db seed

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Start API server (test.db)
        working-directory: apps/api
        run: |
          NODE_ENV=test nohup node dist/server.js > /tmp/agro-api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/ready && break; sleep 1; done
          curl -sf http://localhost:4000/health

      # AUTH-04 ("demo credentials never authenticate against a
      # production-configured service") self-skips unless something answers on
      # 127.0.0.1:4100, and nothing started it — so a security scenario the
      # register counted as PASS was skipped on every CI run while the run still
      # reported green (F-15). The probe boots a second API in NODE_ENV=production
      # against its own fresh, unseeded SQLite file; it is not part of the stack
      # under test and the e2e specs reach it directly over HTTP.
      - name: Start production-config probe (AUTH-04, :4100)
        run: |
          set -euo pipefail
          # If something already answers here, the scenario would be driving an
          # unknown service and could pass for the wrong reason. Fail instead.
          if curl -sf --max-time 3 http://127.0.0.1:4100/health > /dev/null; then
            echo "::error::something is already answering on 127.0.0.1:4100 — AUTH-04 must own this port"
            exit 1
          fi
          nohup node apps/web/e2e/prod-config-probe.mjs > /tmp/agro-prod-probe.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf --max-time 3 http://127.0.0.1:4100/health > /dev/null; then
              echo "prod-config probe answered /health on :4100"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the production-config probe never answered on :4100"
          cat /tmp/agro-prod-probe.log
          exit 1

      - name: Start Web dev server
        working-directory: apps/web
        run: |
          nohup npx vite --port 5173 --strictPort > /tmp/agro-web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:5173/ | grep -q "<div id=\"root\">"

      - name: Run E2E tests (real browser journey)
        working-directory: apps/web
        run: npx playwright test

      # Second pass, production build: the dev-server run above exercises source
      # files; only the built bundle carries the minified output, the built CSS
      # and the version.json stamp, and those are what a user actually loads.
      # VITE_API_BASE_URL is overridden because apps/web/.env.production points
      # at the deployed API; /api/v1 stays relative and `vite preview` inherits
      # server.proxy (Vite's documented preview.proxy default), so requests take
      # the same path as in the dev run.
      - name: Build web bundle (production) for the preview pass
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build --workspace apps/web

      - name: Start Web preview server (built bundle, :4173)
        working-directory: apps/web
        run: |
          nohup npx vite preview --port 4173 --strictPort > /tmp/agro-web-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:4173/ | grep -q "<div id=\"root\">"

      # PLAYWRIGHT_BASE_URL also tells playwright.config.ts that this pass owns
      # its server, so it does not fall back to starting the dev server.
      - name: Run E2E tests against the production build
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test

      # A failing browser run must leave evidence behind (AUD-119): traces,
      # screenshots and the HTML report are otherwise lost with the runner.
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The `quality-gates` job below (knip with the reviewed baseline, jscpd over
  # the shipped source, licences, commitlint, migration drift, TODO gate and
  # generated-docs freshness) is the single quality-gates job of this pipeline:
  # it strictly covers what a second, config-driven job (raw knip / repo-wide
  # jscpd incl. workflow YAML) used to check, minus the duplicate runner
  # minutes and the findings classes that job's review never calibrated.

  android-build:
    name: Android — Build debug APK artifact
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: https://agro-bridge-api-vantiq-systems.vercel.app/api/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # F-88 — why CI installs its own npm instead of using the one Node 22
      # bundles: the install-script allow-list (`allowScripts` in package.json)
      # is an npm 11 surface, and npm 10 runs EVERY dependency install script
      # regardless of the list. Pinning the runner to the version package.json
      # declares is what makes NPM_CONFIG_STRICT_ALLOW_SCRIPTS (workflow env)
      # a gate rather than a no-op, and it means CI and a developer's machine
      # resolve dependencies with the same toolchain. The version comes from
      # package.json — there is no second copy to drift. The same step appears
      # in every job that installs dependencies, and in the Android workflows.
      - name: Pin npm to the package.json packageManager version
        run: |
          set -euo pipefail
          want=$(node -p "require('./package.json').packageManager")
          case "$want" in npm@*) ;; *) echo "::error::package.json has no npm packageManager pin (got: $want)"; exit 1 ;; esac
          npm install --global "$want"
          test "npm@$(npm --version)" = "$want" || { echo "::error::npm pin did not take effect: wanted $want, got npm@$(npm --version)"; exit 1; }
          echo "npm is $want"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # pin v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --workspace @agrobridge/web --include-workspace-root --no-audit --no-fund

      - name: Build PWA bundle
        working-directory: apps/web
        run: npm run build

      - name: Sync Capacitor android platform
        working-directory: apps/web
        run: npx cap sync android

      - name: Assemble debug APK (unsigned release requires keystore)
        working-directory: apps/web/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin v7.0.1
        with:
          name: agrobridge-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  gitleaks:
    name: Security — Gitleaks secret scan
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # pin v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker — Build images
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    needs: [api-quality, api-postgres]
    # id-token + attestations sign the provenance below; contents is the
    # checkout; packages: write is what the push-to-registry form of that
    # attestation would need (and what the release workflow uses against GHCR).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # pin v4.4.1

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # pin v7.4.0
        with:
          context: .
          file: docker/api.Dockerfile
          target: runtime  # the Dockerfile's last stage is `migrate` — name the runtime stage
          push: false
          tags: agrobridge-api:ci
          # loaded into the local daemon so the SBOM step below can scan it
          load: true
          # Layer cache in GitHub Actions storage: the two images and the trivy
          # job share scopes keyed by content, so a warm cache turns a cold npm
          # ci + prisma generate layer into a download.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # F-01: the runtime image must not carry development databases. A working
      # copy of apps/api/prisma holds dev.db / test.db / e2e.db / audit-*.db, and
      # a whole-directory COPY put 23 of them (~21 MB) — bcrypt password hashes,
      # refresh-token hashes, payments and audit rows — inside the shipped
      # production artifact. `.dockerignore` and the targeted COPY in
      # docker/api.Dockerfile stop it; this step is the assertion, so the
      # guarantee lives in CI rather than in two files somebody must remember.
      - name: Assert no development databases in the runtime image
        run: |
          found=$(docker run --rm --entrypoint sh agrobridge-api:ci \
            -c "find /app \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db-journal' \) -print")
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::development database file(s) shipped inside the runtime image"
            exit 1
          fi
          echo "runtime image carries no local databases"

      # Release-artifact evidence (F-06): a CycloneDX SBOM of the image we ship,
      # so "what is in the release?" is answerable by a file rather than a rebuild.
      - name: Generate CycloneDX SBOM (API image)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # pin v0.24.3
        with:
          image: agrobridge-api:ci
          format: cyclonedx-json
          output-file: agrobridge-api.sbom.cdx.json
          # upload via actions/upload-artifact below so retention-days is explicit
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin v7.0.1
        with:
          name: agrobridge-api-sbom
          path: agrobridge-api.sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

      # Provenance (SEC-07): the SBOM file is the release artifact that leaves
      # this job, so it is what carries a signed attestation — the images are
      # built with push:false and never exist in a registry, so there is no
      # image digest a consumer could verify. `gh attestation verify
      # agrobridge-api.sbom.cdx.json --repo <owner>/<repo>` checks it later.
      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # pin v4.2.2
        with:
          subject-path: agrobridge-api.sbom.cdx.json

      - name: Build Web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # pin v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          tags: agrobridge-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The unit and image gates above prove parts; this proves the composition:
  # docker-compose.yml is what operators run, and its ports, healthcheck and
  # required-variable contract can break without any test noticing. Builds the
  # real images via compose (not build-push-action), waits for the API the way
  # an operator would, then tears the stack down including the database volume.
  compose-smoke:
    name: Docker — Compose smoke (db + api)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    env:
      # docker-compose.yml refuses to start without these (`:?` guards); the
      # values are the same throwaway ones the other CI jobs use.
      POSTGRES_PASSWORD: ci-password
      API_DATABASE_URL: postgresql://agrobridge:ci-password@db:5432/agrobridge?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      # Both compose files are operator entry points and nothing in CI parsed them
      # until now: docker-compose.yml is what a laptop runs, docker-compose.prod.yml
      # is what the staging VM runs, and a wrong image namespace, a missing
      # required-variable guard or a bad YAML type was only discovered at deploy
      # time (F-18). `config` needs no daemon, so this costs seconds.
      - name: Validate both compose files render (required-variable contract included)
        run: |
          set -euo pipefail
          # The prod file's `env_file: .env` is part of its contract; a CI checkout
          # has no .env, and this gate must never read a real one.
          test ! -f .env || { echo "::error::a .env file is present in the CI checkout"; exit 1; }
          trap 'rm -f .env' EXIT
          cat > .env <<'EOF'
          # CI placeholders for the CONTRACT only — never deployed. Names, not values.
          POSTGRES_PASSWORD=ci-password
          API_DATABASE_URL=postgresql://agrobridge:ci-password@db:5432/agrobridge?schema=public
          MIGRATE_DATABASE_URL=postgresql://agrobridge:ci-password@db:5432/agrobridge?schema=public
          JWT_ACCESS_SECRET=ci-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET=ci-refresh-secret-fedcba9876543210
          WEB_ORIGIN=https://ci.invalid
          TLS_CERTS_DIR=/etc/ci-placeholder-certs
          EOF
          API_IMAGE_TAG=sha-ci WEB_IMAGE_TAG=sha-ci docker compose -f docker-compose.prod.yml config --quiet
          echo "docker-compose.prod.yml renders with the required variables"
          docker compose -f docker-compose.yml config --quiet
          echo "docker-compose.yml renders"

      # The guards are the deliverable, not a formality: without the image tags
      # the prod file must REFUSE to render rather than fall back to a mutable
      # `latest` under a namespace this project does not own, and without a
      # certificate directory it must not publish 443 at all (F-18, F-87).
      - name: The prod compose must refuse to render without its guards
        run: |
          set -euo pipefail
          test ! -f .env || { echo "::error::a .env file is present in the CI checkout"; exit 1; }
          trap 'rm -f .env' EXIT
          printf 'TLS_CERTS_DIR=/etc/ci-placeholder-certs\nPOSTGRES_PASSWORD=ci-password\n' > .env
          if API_IMAGE_TAG= WEB_IMAGE_TAG= docker compose -f docker-compose.prod.yml config --quiet 2>/dev/null; then
            echo "::error::docker-compose.prod.yml rendered without API_IMAGE_TAG/WEB_IMAGE_TAG — the fail-closed image-tag guard is gone"
            exit 1
          fi
          if TLS_CERTS_DIR= API_IMAGE_TAG=sha-ci WEB_IMAGE_TAG=sha-ci docker compose -f docker-compose.prod.yml config --quiet 2>/dev/null; then
            echo "::error::docker-compose.prod.yml rendered without TLS_CERTS_DIR — the TLS mount guard is gone"
            exit 1
          fi
          echo "prod compose refuses to render without the image tags and the TLS certificate directory"

      - name: Build and start db + api
        run: docker compose -f docker-compose.yml up -d --build db api

      - name: API must answer /health on the published port
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API answered /health on :4000"
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml logs --no-color api db || true
          echo "::error::the composed API never answered /health on :4000"
          exit 1

      # always(): a failed wait above must not leave containers and the volume
      # behind on the runner.
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v

  trivy-scan:
    name: Security — Trivy container scan (HIGH/CRITICAL)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    needs: [docker-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # pin v4.4.1

      - name: Build API image for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # pin v7.4.0
        with:
          context: .
          file: docker/api.Dockerfile
          target: runtime  # the Dockerfile's last stage is `migrate` — name the runtime stage
          push: false
          tags: agrobridge-api:scan
          load: true
          # Same content-keyed cache scope as docker-build; without it this job
          # rebuilds the image the previous job just built from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fail the build on HIGH/CRITICAL findings; accepted risks live in
      # /.trivyignore.yaml and must cross-reference SECURITY_WAIVERS.md. The
      # ignore file is now the single one for both scan jobs (F-96), so it is
      # passed explicitly — the CLI's default plain `.trivyignore` is gone.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # pin v0.36.0
        with:
          image-ref: agrobridge-api:scan
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

  iac-scan:
    name: Security — IaC config scan
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      # Config-mode Trivy over the repo's infrastructure-as-code (Dockerfiles,
      # YAML infrastructure). The image scan above covers CVEs *inside* built
      # images; this covers *how* the image and hosts are configured — a root
      # user or a missing healthcheck is invisible to vulnerability scanning
      # of packages, because it is not a package.
      # Accepted findings live in /.trivyignore.yaml — ONE file for both scan
      # jobs since 2026-11-10 (F-96), with a required SECURITY_WAIVERS.md
      # cross-reference. The CLI does not auto-load the YAML ignore file, so it
      # is passed explicitly via the action's trivyignores input; the
      # vulnerability scan above passes the same file.
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # pin v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore.yaml

  security-scan:
    name: Security — Dependency audit & secret scan
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # F-88 — why CI installs its own npm instead of using the one Node 22
      # bundles: the install-script allow-list (`allowScripts` in package.json)
      # is an npm 11 surface, and npm 10 runs EVERY dependency install script
      # regardless of the list. Pinning the runner to the version package.json
      # declares is what makes NPM_CONFIG_STRICT_ALLOW_SCRIPTS (workflow env)
      # a gate rather than a no-op, and it means CI and a developer's machine
      # resolve dependencies with the same toolchain. The version comes from
      # package.json — there is no second copy to drift. The same step appears
      # in every job that installs dependencies, and in the Android workflows.
      - name: Pin npm to the package.json packageManager version
        run: |
          set -euo pipefail
          want=$(node -p "require('./package.json').packageManager")
          case "$want" in npm@*) ;; *) echo "::error::package.json has no npm packageManager pin (got: $want)"; exit 1 ;; esac
          npm install --global "$want"
          test "npm@$(npm --version)" = "$want" || { echo "::error::npm pin did not take effect: wanted $want, got npm@$(npm --version)"; exit 1; }
          echo "npm is $want"

      - name: npm audit — production deps must be clean (fail on moderate+)
        run: npm audit --omit=dev --audit-level=moderate

      - name: npm audit — full tree (dev deps reported, non-blocking)
        run: npm audit --audit-level=high || echo "::warning::dev-only audit findings — review required"

      - name: Secret scan (tracked files must not contain real credentials)
        shell: bash
        run: |
          # Heuristic scanner: flags private keys and hard-coded postgres URLs with passwords.
          # Allowlist: dummy/ci-password/test placeholders are not real secrets.
          if git grep -I -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- .; then
            echo "::error::Private key material committed"; exit 1
          fi
          if git grep -InE 'postgres(ql)?://[^/@:\s]+:[^@\s]+@' -- ':!*.md' ':!.env.example' | grep -vE 'dummy|ci-password|example|changeme' ; then
            echo "::error::Hard-coded database credential pattern found"; exit 1
          fi
          echo "Secret scan clean"

      # A committed dump, database file or build output is invisible in review
      # and irreversible in history. One command, whole-index: git ls-tree -l
      # reports sizes, so no per-file subprocess is needed. Keep the allowlist
      # minimal — .gitignore already excludes build output (APKs, dist, *.db).
      - name: Repository hygiene — oversized and stray files
        shell: bash
        run: |
          set -uo pipefail
          LIMIT=$((1024 * 1024))
          # Docs screenshots and static web assets are the only legitimate
          # binaries; everything else over the limit is a mistake.
          ALLOW='^(docs/.*\.(png|jpg|jpeg|gif|webp|mp4)|apps/web/public/.*\.(png|jpg|jpeg|svg|webp|ico|woff2?))$'
          fail=0
          while IFS=$'\t' read -r meta path; do
            size=${meta##* }
            case "$size" in ''|*[!0-9]*) continue ;; esac
            if [ "$size" -gt "$LIMIT" ] && ! printf '%s' "$path" | grep -Eq "$ALLOW"; then
              echo "::error file=$path::tracked file is $((size / 1024)) KiB (> 1 MiB) and not on the asset allowlist"
              fail=1
            fi
          done < <(git ls-tree -rl HEAD)
          stray=$(git ls-files | grep -E '\.(log|bak|tmp)$' || true)
          if [ -n "$stray" ]; then
            printf '%s\n' "$stray"
            echo "::error::stray log/backup/temp file is tracked"
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "Repository hygiene clean"
          exit $fail
