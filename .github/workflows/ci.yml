name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Supersede outdated runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN (CodeQL manages its own via codeql.yml).
permissions:
  contents: read

jobs:
  api-quality:
    name: API — Lint · TypeCheck · Tests (SQLite)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    env:
      DATABASE_URL: "file:./test.db"
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210
      # A browser suite signs in far more often than a person and the login limit
      # is per IP; the default (20/15min) is the production policy and is still
      # exercised by the API test suite. This instance is ephemeral.
      LOGIN_RATE_LIMIT_MAX: "500"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --workspace @agrobridge/api --include-workspace-root --no-audit --no-fund

      - name: Approve build scripts (prisma engines/esbuild)
        run: |
          npm config set ignore-scripts false || true
          npm rebuild @prisma/engines prisma esbuild 2>/dev/null || true

      - name: Prisma generate + validate
        working-directory: apps/api
        run: npx prisma validate && npx prisma generate

      - name: Lint
        working-directory: apps/api
        run: npx eslint src tests

      - name: Typecheck (build)
        working-directory: apps/api
        run: npm run typecheck

      - name: Unit / Integration / E2E journeys with coverage gate (SQLite)
        working-directory: apps/api
        run: npx vitest run --coverage

      - name: Validate PostgreSQL schema variant
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://agrobridge:ci-password@localhost:5432/agrobridge
        run: npx prisma validate --schema prisma/schema.postgresql.prisma

  # Dependency/dead-code/duplication/licence/migration-drift gates (CID-06, SLP-02).
  # Each threshold sits at the measured baseline with a document ratchet: knip
  # findings are gated through scripts/knip-gate.mjs (reviewed baseline + reasons),
  # jscpd fails above 3% (measured 2.47%), the licence allow-list is
  # scripts/licence-allowlist.json, and the migration chain must reproduce the
  # schema with zero drift (scripts/drift-check.mjs).
  quality-gates:
    name: Quality gates — knip / jscpd / licences / commitlint / migration drift
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          # commitlint checks the commit range, not just the checkout SHA
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: knip (dead files, unused deps, unlisted)
        run: node scripts/knip-gate.mjs
      - name: jscpd duplication <= 3%
        run: npx jscpd --silent --threshold 3 apps/api/src apps/web/src
      - name: licence allow-list
        run: node scripts/licence-gate.mjs
      - name: commitlint (push range)
        run: npx commitlint --from=HEAD~1 --to=HEAD
      - name: migration drift
        run: node scripts/drift-check.mjs
      - name: no TODO/FIXME markers in shipped source
        run: node scripts/todo-gate.mjs
      - name: generated docs freshness (route matrix + ERD)
        run: |
          node apps/api/scripts/route-matrix.mjs --check
          node apps/api/scripts/gen-erd.mjs --check


  api-postgres:
    name: API — Integration & Concurrency (PostgreSQL 17)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agrobridge
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: agrobridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrobridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agrobridge:ci-password@localhost:5432/agrobridge
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --workspace @agrobridge/api --include-workspace-root --no-audit --no-fund

      - name: Provision PostgreSQL (schema + client + seed)
        working-directory: apps/api
        run: node scripts/provision-postgres.mjs

      - name: Full suite incl. concurrency & security matrix on PostgreSQL
        working-directory: apps/api
        run: npx vitest run --config vitest.config.pg.ts

  web-quality:
    name: Web — Lint · Unit · Build
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: https://agro-bridge-api-vantiq-systems.vercel.app/api/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --workspace @agrobridge/web --include-workspace-root --no-audit --no-fund

      # K-08: version.json is canonical; a release bump must touch every manifest.
      - name: Version consistency
        run: node scripts/check-versions.mjs

      - name: Lint (eslint + jsx-a11y)
        working-directory: apps/web
        run: npm run lint

      - name: i18n dictionary check
        working-directory: apps/web
        run: npm run i18n:check

      - name: Unit tests (vitest, with coverage gate)
        working-directory: apps/web
        run: npm run test:unit -- --coverage

      - name: Build (includes type check)
        working-directory: apps/web
        run: npm run build

      # Runs against dist/ and both vercel.json files: the CSP hash of the inline
      # theme script, the API origin the bundle bakes into connect-src, the two
      # Vercel configs agreeing, and the performance budgets. Each of those fails
      # silently in production and cannot be seen from source alone.
      - name: Release preflight (CSP hash, API origin, budgets)
        working-directory: apps/web
        run: npm run preflight

  web-e2e:
    name: Web — E2E (Playwright)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 30
    env:
      DATABASE_URL: "file:./test.db"
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210
      # A browser suite makes far more requests and sign-ins than a person; the
      # default production policies (300 req / 20 logins per 15 min / IP) sit
      # close enough to the suite's own volume that a second local run against
      # the same server exhausted them and failed unrelated tests (AUD-134).
      # This runner instance is ephemeral; the policy limits stay exercised by
      # the API suites.
      RATE_LIMIT_MAX: "2000"
      LOGIN_RATE_LIMIT_MAX: "500"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (all workspaces)
        run: npm ci --include-workspace-root --no-audit --no-fund

      - name: Approve build scripts (prisma engines/esbuild)
        run: |
          npm config set ignore-scripts false || true
          npm rebuild @prisma/engines prisma esbuild 2>/dev/null || true

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Provision seeded SQLite database + API client
        working-directory: apps/api
        run: |
          npx prisma generate --schema prisma/schema.prisma
          npx prisma migrate deploy
          npx prisma db seed

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Start API server (test.db)
        working-directory: apps/api
        run: |
          NODE_ENV=test nohup node dist/server.js > /tmp/agro-api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/ready && break; sleep 1; done
          curl -sf http://localhost:4000/health

      - name: Start Web dev server
        working-directory: apps/web
        run: |
          nohup npx vite --port 5173 --strictPort > /tmp/agro-web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ > /dev/null && break; sleep 1; done
          curl -sf http://localhost:5173/ | grep -q "<div id=\"root\">"

      - name: Run E2E tests (real browser journey)
        working-directory: apps/web
        run: npx playwright test

      # A failing browser run must leave evidence behind (AUD-119): traces,
      # screenshots and the HTML report are otherwise lost with the runner.
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  android-build:
    name: Android — Build debug APK artifact
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: https://agro-bridge-api-vantiq-systems.vercel.app/api/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # pin v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --workspace @agrobridge/web --include-workspace-root --no-audit --no-fund

      - name: Build PWA bundle
        working-directory: apps/web
        run: npm run build

      - name: Sync Capacitor android platform
        working-directory: apps/web
        run: npx cap sync android

      - name: Assemble debug APK (unsigned release requires keystore)
        working-directory: apps/web/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin v7.0.1
        with:
          name: agrobridge-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  gitleaks:
    name: Security — Gitleaks secret scan
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # pin v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker — Build images
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    needs: [api-quality, api-postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # pin v4.4.1

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # pin v7.4.0
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: agrobridge-api:ci
          # loaded into the local daemon so the SBOM step below can scan it
          load: true

      # F-01: the runtime image must not carry development databases. A working
      # copy of apps/api/prisma holds dev.db / test.db / e2e.db / audit-*.db, and
      # a whole-directory COPY put 23 of them (~21 MB) — bcrypt password hashes,
      # refresh-token hashes, payments and audit rows — inside the shipped
      # production artifact. `.dockerignore` and the targeted COPY in
      # docker/api.Dockerfile stop it; this step is the assertion, so the
      # guarantee lives in CI rather than in two files somebody must remember.
      - name: Assert no development databases in the runtime image
        run: |
          found=$(docker run --rm --entrypoint sh agrobridge-api:ci \
            -c "find /app \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db-journal' \) -print")
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::development database file(s) shipped inside the runtime image"
            exit 1
          fi
          echo "runtime image carries no local databases"

      # Release-artifact evidence (F-06): a CycloneDX SBOM of the image we ship,
      # so "what is in the release?" is answerable by a file rather than a rebuild.
      - name: Generate CycloneDX SBOM (API image)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # pin v0.24.3
        with:
          image: agrobridge-api:ci
          format: cyclonedx-json
          output-file: agrobridge-api.sbom.cdx.json
          # upload via actions/upload-artifact below so retention-days is explicit
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin v7.0.1
        with:
          name: agrobridge-api-sbom
          path: agrobridge-api.sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Build Web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # pin v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          tags: agrobridge-web:ci

  trivy-scan:
    name: Security — Trivy container scan (HIGH/CRITICAL)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    needs: [docker-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # pin v4.4.1

      - name: Build API image for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # pin v7.4.0
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: agrobridge-api:scan
          load: true

      # Fail the build on HIGH/CRITICAL findings; accepted risks live in
      # /.trivyignore and must cross-reference SECURITY_WAIVERS.md.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # pin v0.36.0
        with:
          image-ref: agrobridge-api:scan
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  iac-scan:
    name: Security — IaC config scan
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      # Config-mode Trivy over the repo's infrastructure-as-code (Dockerfiles,
      # YAML infrastructure). The image scan above covers CVEs *inside* built
      # images; this covers *how* the image and hosts are configured — a root
      # user or a missing healthcheck is invisible to vulnerability scanning
      # of packages, because it is not a package.
      # Accepted findings live in /.trivyignore.yaml (one entry today: the nginx
      # TLS container's root master process, AVD-DS-0002) with a required
      # SECURITY_WAIVERS.md cross-reference — the same process as /.trivyignore.
      # The CLI does not auto-load the YAML ignore file, so it is passed
      # explicitly via the action's trivyignores input.
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # pin v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore.yaml

  security-scan:
    name: Security — Dependency audit & secret scan
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm audit — production deps must be clean (fail on moderate+)
        run: npm audit --omit=dev --audit-level=moderate

      - name: npm audit — full tree (dev deps reported, non-blocking)
        run: npm audit --audit-level=high || echo "::warning::dev-only audit findings — review required"

      - name: Secret scan (tracked files must not contain real credentials)
        shell: bash
        run: |
          # Heuristic scanner: flags private keys and hard-coded postgres URLs with passwords.
          # Allowlist: dummy/ci-password/test placeholders are not real secrets.
          if git grep -I -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- .; then
            echo "::error::Private key material committed"; exit 1
          fi
          if git grep -InE 'postgres(ql)?://[^/@:\s]+:[^@\s]+@' -- ':!*.md' ':!.env.example' | grep -vE 'dummy|ci-password|example|changeme' ; then
            echo "::error::Hard-coded database credential pattern found"; exit 1
          fi
          echo "Secret scan clean"
