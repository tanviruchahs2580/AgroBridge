# Production deployment verification.
#
# Deployment itself is performed by Vercel's Git integration on push to main
# (plus `vercel --prod` for API changes that need a new environment variable).
# This workflow is the GATE that proves a deployment happened and that the
# artifact running in production includes the reviewed sources — without it,
# "deployed" was an assumption made from a CLI output.
#
# It needs no secrets: it reads the build stamp the web bundle publishes and the
# commit the API reports on /health.
#
# Shape history (all three were found by running it, not by reading it):
#   1. v1 demanded `live == HEAD` — wrong in a monorepo where the host deploys per
#      project, so a web-only commit legitimately left the API behind.
#   2. v2 used ancestry but with `fetch-depth: 1`, whose truncated history made
#      `git log -- <path>` return HEAD for any path and `merge-base` exit 128.
#   3. v3 gave the web step a retry loop but left the API step single-shot, so a
#      deployment still in flight read as "stale" (a50ac54).
# Both projects now poll the same way, and a real staleness still fails after the
# window — the difference is patience, not tolerance.
name: Deploy verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  WEB_URL: https://agrobridge-web.vercel.app
  API_URL: https://agro-bridge-api.vercel.app

jobs:
  verify-production:
    name: Production includes the reviewed commit
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with:
          # Full history is required, not a convenience: this gate compares commits
          # by ancestry, and a depth-1 clone cannot do that.
          fetch-depth: 0

      - name: Wait for the web and API builds to include the reviewed sources
        run: |
          set -euo pipefail

          # Poll a deployment that reports its commit (web: version.json,
          # API: /health) until it includes `required`. Distinguishes three
          # outcomes: ancestor (done), not an ancestor yet (keep waiting), and
          # could-not-compare (fail immediately — that is a broken environment,
          # not a slow deployment).
          wait_for_inclusion() {
            local required="$1" url="$2" label="$3" attempts="${4:-30}"
            for attempt in $(seq 1 "$attempts"); do
              local body live rc=0
              body=$(curl -fsS -m 20 "$url" || true)
              live=$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).commit||''))}catch{process.stdout.write('')}})")
              if [ -n "$live" ]; then
                git merge-base --is-ancestor "$required" "$live" 2>/dev/null || rc=$?
                case $rc in
                  0) echo "$label: $live includes every change through $required"; return 0 ;;
                  1) echo "$label: attempt $attempt/$attempts — $live does not include $required yet" ;;
                  *) echo "::error::$label: cannot compare $required with $live (git exit $rc)"; return 2 ;;
                esac
              else
                echo "$label: attempt $attempt/$attempts — no commit reported yet"
              fi
              sleep 20
            done
            echo "::error::$label: production never reported a build including $required within the window — the deployment failed or did not run"
            return 1
          }

          HEAD_SHA=$(git rev-parse HEAD)
          REQUIRED_WEB=$(git log -1 --format=%h -- apps/web version.json)
          REQUIRED_API=$(git log -1 --format=%h -- apps/api version.json scripts/vercel-build-api.mjs)
          echo "HEAD $HEAD_SHA · newest web change $REQUIRED_WEB · newest API change $REQUIRED_API"

          wait_for_inclusion "$REQUIRED_WEB" "$WEB_URL/version.json" "web"

          # Off-main deploys are a different failure: something shipped that was
          # never reviewed. Checked after freshness so the message is unambiguous.
          LIVE_WEB=$(curl -fsS -m 20 "$WEB_URL/version.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{process.stdout.write(String(JSON.parse(s).commit))})")
          git merge-base --is-ancestor "$LIVE_WEB" "$HEAD_SHA" 2>/dev/null || {
            echo "::error::the web deployment reports $LIVE_WEB, which is not on main — a deploy came from somewhere else"
            exit 1
          }

          wait_for_inclusion "$REQUIRED_API" "$API_URL/health" "api"

      - name: API readiness and surface check
        run: |
          set -euo pipefail
          curl -fsS -m 30 "$API_URL/ready" | tee /tmp/ready.json
          grep -q '"db":true' /tmp/ready.json || { echo "::error::API reports the database is not ready"; exit 1; }

          # Which rate-limit store production actually runs: without Redis every
          # serverless instance enforces its own windows (accepted fail-open,
          # docs/security.md). Printed, not asserted — the decision is documented,
          # the point is that it can never again be invisible.
          STORE=$(node -e "let s=require('fs').readFileSync('/tmp/ready.json','utf8');try{process.stdout.write(String(JSON.parse(s).limiterStore||'unreported'))}catch{process.stdout.write('unparsed')}")
          echo "rate-limit store in production: $STORE"

          # A public route that only exists in recent builds: proves the deployed
          # code is current rather than merely healthy. Expect a 303 to the web app.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$API_URL/api/v1/payments/gateway/return/success")
          echo "gateway return responded $CODE"
          [ "$CODE" = "303" ] || { echo "::error::expected 303 from /payments/gateway/return/success, got $CODE"; exit 1; }

      # Code and schema ship together, or the release is not complete.
      #
      # Nothing checked this until 2026-10-18, when three migrations (a partial
      # unique index on pending payments plus six hot-query indexes) turned out to
      # have been reviewed, merged and deployed — while production's database had
      # never applied them. Every gate was green. The schema was the one artifact
      # in the release with no enforcement, so the gate now compares what
      # production reports on `/ready` with the newest migration in the repository
      # (ADR-0007). Fix by running `apps/api/scripts/deploy-migrations.mjs` per
      # docs/runbooks/live-deployment.md, then re-running this workflow.
      - name: Production schema includes the reviewed migrations
        run: |
          set -euo pipefail
          # Production is PostgreSQL; the SQLite chain is the local/dev dialect
          # (ADR-0004) and must never be the reference for what production runs.
          REQUIRED=$(ls apps/api/prisma/postgres/migrations | grep -v '^migration_lock.toml$' | sort | tail -1)
          echo "newest reviewed migration: $REQUIRED"

          for attempt in $(seq 1 30); do
            body=$(curl -fsS -m 20 "$API_URL/ready" || true)
            latest=$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).schema?.latest||''))}catch{process.stdout.write('')}})")
            if [ "$latest" = "$REQUIRED" ]; then
              echo "schema: production has applied $latest"
              exit 0
            fi
            if [ -n "$latest" ]; then
              echo "attempt $attempt/30 — production reports schema $latest, expected $REQUIRED"
            else
              # Either the deployment in flight predates the schema readout, or
              # the database is unreachable. Both resolve to patience here and a
              # verdict after the window.
              echo "attempt $attempt/30 — production does not report schema state yet"
            fi
            sleep 20
          done
          echo "::error::production schema is behind the reviewed migrations (expected $REQUIRED) — run apps/api/scripts/deploy-migrations.mjs (docs/runbooks/live-deployment.md), then re-run this workflow"
          exit 1
