# Chromatic / Storybook visual-regression gate.
# Manual trigger: requires a configured CHROMATIC_PROJECT_TOKEN repo secret and a
# Storybook build (@storybook + "build-storybook" script). Until provisioned,
# this stays on workflow_dispatch so it never breaks the push/pull_request gate.
name: chromatic
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromatic:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    # Browsers + a Storybook build: 30 min (same class as web-e2e in ci.yml).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with: { node-version: 22 }
      - run: npm ci
        working-directory: apps/web
      - uses: chromaui/action@1cfa065cbdab28f6ca3afaeb3d761383076a35aa # pin v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/web
