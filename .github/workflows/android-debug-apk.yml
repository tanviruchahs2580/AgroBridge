# Debug APK build pipeline (no signing secrets needed — debug keystore is public).
# Produces the installable test APK: CI is the single source of truth for release
# artifacts (local dev machines may not carry an Android SDK).
name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

# One debug build per ref: a second dispatch supersedes the first instead of
# racing it for the same Gradle caches and artifact name (F-85). Unlike the
# signed release below, cancelling is what an operator wants here — the newest
# dispatch is the artifact they asked for.
concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

# Workflow-wide: every npm invocation enforces the install-script allow-list in
# package.json (see the note on the pin step; F-88).
env:
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"

jobs:
  debug-apk:
    name: Build debug APK (Capacitor)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pin v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # pin v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # F-88 — see the full note in ci.yml's api-quality job: `allowScripts` is an
      # npm 11 surface, Node 22 bundles npm 10, and NPM_CONFIG_STRICT_ALLOW_SCRIPTS
      # (workflow env) only means anything once npm is pinned to the version
      # package.json declares.
      - name: Pin npm to the package.json packageManager version
        run: |
          set -euo pipefail
          want=$(node -p "require('./package.json').packageManager")
          case "$want" in npm@*) ;; *) echo "::error::package.json has no npm packageManager pin (got: $want)"; exit 1 ;; esac
          npm install --global "$want"
          test "npm@$(npm --version)" = "$want" || { echo "::error::npm pin did not take effect: wanted $want, got npm@$(npm --version)"; exit 1; }
          echo "npm is $want"

      - name: Install web workspace deps
        run: npm ci --workspace @agrobridge/web --include-workspace-root --no-audit --no-fund

      - name: Build web bundle (production, live API baked in)
        working-directory: apps/web
        run: npm run build

      - name: Sync Capacitor android project
        working-directory: apps/web
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pin v7.0.2
        with:
          name: agrobridge-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
