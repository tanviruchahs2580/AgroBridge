# Debug APK build pipeline (no signing secrets needed — debug keystore is public).
# Produces the installable test APK: CI is the single source of truth for release
# artifacts (local dev machines may not carry an Android SDK).
name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  debug-apk:
    name: Build debug APK (Capacitor)
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # pin v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web workspace deps
        run: npm ci --workspace @agrobridge/web --include-workspace-root --no-audit --no-fund

      - name: Build web bundle (production, live API baked in)
        working-directory: apps/web
        run: npm run build

      - name: Sync Capacitor android project
        working-directory: apps/web
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin v7.0.1
        with:
          name: agrobridge-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
