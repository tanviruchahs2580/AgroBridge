# Production composition (single VM behind TLS terminated in this stack).
#
# Usage:
#   1. `docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate`
#      (applies the PostgreSQL migration chain — a separate, gated step)
#   2. `docker compose -f docker-compose.prod.yml up -d`
#
# Requires an .env beside this file (see .env.example for the full list) plus:
#   POSTGRES_PASSWORD, API_DATABASE_URL (the app-role connection URL for
#   db:5432/agrobridge?schema=public — spelled out in the VM's .env, never here:
#   a scheme://user:pass@host literal in a tracked file trips the CI secret scan),
#   MIGRATE_DATABASE_URL (owner role — required by the `migrate` service on a
#   two-role split; defaults to API_DATABASE_URL, whose role cannot DDL),
#   JWT_ACCESS_SECRET, JWT_REFRESH_SECRET (64-char random), WEB_ORIGIN,
#   TLS_CERTS_DIR (host directory holding fullchain.pem + privkey.pem),
#   API_IMAGE_TAG and WEB_IMAGE_TAG (the immutable sha-<commit> tags pushed by
#   .github/workflows/deploy-staging.yml — both are REQUIRED: with no default
#   the file cannot render, so a stack can never fall back to a mutable tag
#   under a namespace this project does not own (F-18)).
#
# Registry namespace: the lowercase form of github.repository (AgroBridge →
# agrobridge), which is what docker/metadata-action pushes. `docker compose
# config --quiet` is a CI gate (ci.yml compose-smoke job) precisely so this
# string and the workflow cannot drift apart again.
#
# Rollback (application only, no rebuild — the bytes are already in GHCR):
#   API_IMAGE_TAG=sha-<previous-commit> WEB_IMAGE_TAG=sha-<previous-commit> \
#     docker compose -f docker-compose.prod.yml up -d
# Migrations are forward-only and are NOT applied on boot by design (ADR-0010):
# a rollback that crosses a migration needs its own compensating migration.
name: agrobridgeapp
services:
  db:
    # Same two-role split as the local stack (docker/postgres-init/01-roles.sql):
    # the app connects with a DML-only role while migrations run as the owner.
    # On a managed database (Neon) that split is two URLs against the same
    # project — pooled/app for the runtime, direct/owner for `prisma migrate
    # deploy` — instead of a container init script; see docs/deployment.md §5.
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 # postgres:17-alpine, aligns with CI (ci.yml api-postgres job)
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrobridge
      POSTGRES_USER: ${POSTGRES_USER:-agrobridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Same first-start-only role/grant setup as the local stack — the comment
      # above promised the two-role split but nothing mounted it for the compose
      # path (found by the audit's cold read).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrobridge} -d agrobridge"]
      interval: 10s
      timeout: 5s
      retries: 5
    # resource ceiling (compose v2 non-swarm syntax; equivalent to deploy.resources.limits.memory)
    mem_limit: 1g

  api:
    image: ghcr.io/tanviruchahs2580/agrobridge/api:${API_IMAGE_TAG:?set API_IMAGE_TAG to the sha-<commit> tag pushed by deploy-staging.yml}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Production uses the PostgreSQL schema variant (baked into the image; see docker/api.Dockerfile)
      DATABASE_URL: ${API_DATABASE_URL:?set API_DATABASE_URL}
    volumes:
      # STORAGE_PROVIDER=local disease-photo uploads. Must match the API's
      # resolved base (cwd /app/apps/api + "uploads") so files survive recreation.
      - uploads:/app/apps/api/uploads
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    # Readiness, not liveness (H-09): /ready additionally proves the DB answers
    # (`SELECT 1`) and reports the applied schema state (ADR-0007), so compose
    # treats an API whose DB is unreachable as unhealthy rather than "up" — the
    # deploy gate probes the same endpoint. /health stays the liveness signal.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # resource ceilings (deploy.resources.limits equivalents): memory 1g / cpus 1.0
    mem_limit: 1g
    cpus: 1.0
    # NO published host port by design — web nginx proxies /api (see docker/web.nginx.prod.conf)

  # Schema change, then code change — two steps that can fail independently, so
  # neither is hidden inside the other (F-18). The api runtime image carries no
  # npm/npx and no Prisma CLI on purpose (docker/api.Dockerfile); the migration
  # runs from the same Dockerfile's `migrate` stage instead of widening the
  # runtime image's surface. `migrate deploy` is idempotent and append-only.
  #
  # Run: docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
  # It is a profile, so a plain `up -d` never applies schema changes.
  migrate:
    image: ghcr.io/tanviruchahs2580/agrobridge/api-migrate:${API_IMAGE_TAG:?set API_IMAGE_TAG to the sha-<commit> tag pushed by deploy-staging.yml}
    profiles: ["migrate"]
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # DDL runs as the database owner. On the two-role compose stack the owner
      # is POSTGRES_USER (`agrobridge`) and the app role (`agrobridge_app`) has
      # no CREATE privilege — so point MIGRATE_DATABASE_URL at the owner and the
      # default below fails loudly rather than running with fewer rights.
      DATABASE_URL: ${MIGRATE_DATABASE_URL:-${API_DATABASE_URL}}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    mem_limit: 512m

  web:
    image: ghcr.io/tanviruchahs2580/agrobridge/web:${WEB_IMAGE_TAG:?set WEB_IMAGE_TAG to the sha-<commit> tag pushed by deploy-staging.yml}
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      # TLS material for the 443 listener in docker/web.nginx.prod.conf. The
      # directory must hold fullchain.pem and privkey.pem (point it at
      # /etc/letsencrypt/live/<your-domain> when certbot manages the host), and
      # it is REQUIRED — the file refuses to render without it, because
      # publishing 443 with no certificate was connection-refused (F-87).
      - ${TLS_CERTS_DIR:?set TLS_CERTS_DIR to the directory holding fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
      - ./docker/web.nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - edge
      - internal
    # Healthcheck over the plain-HTTP listener's /healthz (which the 80→443
    # redirect exempts): probing "/" would follow the redirect to https:// over
    # the loopback name and fail the certificate check for a healthy service.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m

networks:
  internal:
    internal: true # api/db unreachable from outside; only web bridges to edge
  edge:

volumes:
  pgdata:
  uploads:
