# Production composition (single VM behind TLS).
# Usage: docker compose -f docker-compose.prod.yml up -d
# Requires a .env beside this file (see .env.example for variable names) plus:
#   POSTGRES_PASSWORD, API_DATABASE_URL (postgresql://...@db:5432/agrobridge?schema=public),
#   JWT_ACCESS_SECRET, JWT_REFRESH_SECRET (64-char random), WEB_ORIGIN.
#
# NOTE: migrations are NOT applied on boot by design.
# Apply manually per docs/deployment.md §5:
#   docker compose -f docker-compose.prod.yml exec api npx prisma migrate deploy
services:
  db:
    image: postgres:17-alpine # aligns with CI (ci.yml api-postgres job)
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrobridge
      POSTGRES_USER: ${POSTGRES_USER:-agrobridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrobridge} -d agrobridge"]
      interval: 10s
      timeout: 5s
      retries: 5
    # resource ceiling (compose v2 non-swarm syntax; equivalent to deploy.resources.limits.memory)
    mem_limit: 1g

  api:
    image: ghcr.io/agrobridge/agrobridge/api:${API_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Production uses the PostgreSQL schema variant (baked into the image; see docker/api.Dockerfile)
      DATABASE_URL: ${API_DATABASE_URL:?set API_DATABASE_URL}
    volumes:
      - uploads:/app/uploads # STORAGE_PROVIDER=local disease-photo uploads
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # resource ceilings (deploy.resources.limits equivalents): memory 1g / cpus 1.0
    mem_limit: 1g
    cpus: 1.0
    # NO published host port by design — web nginx proxies /api (see docker/web.nginx.prod.conf)

  web:
    image: ghcr.io/agrobridge/agrobridge/web:${WEB_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      # TLS termination on this container; obtain certs first (certbot standalone or webroot)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./docker/web.nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - edge
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m

networks:
  internal:
    internal: true # api/db unreachable from outside; only web bridges to edge
  edge:

volumes:
  pgdata:
  uploads:
