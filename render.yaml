services:
  - type: postgresql
    name: agrobridge-db
    plan: free
    region: oregon
    databaseName: agrobridge
    user: agrobridge
    version: "16"

  - type: web_service
    name: agrobridge-api-node
    plan: free
    region: oregon
    repo: https://github.com/tanviruchahs2580/AgroBridge
    branch: main
    buildCommand: npm install --include=dev && npx prisma generate --schema=apps/api/prisma/schema.postgresql.prisma && npm run build --workspace apps/api
    startCommand: node apps/api/dist/server.js
    # deploy-migrations.mjs is dialect-aware and baseline-safe: the live PG DB
    # predates the migration chain (created via db push), so the script marks
    # already-present schema as applied before deploying new migrations.
    # Seed is guarded in seed.ts: in production it only creates demo accounts
    # when ALLOW_DEMO_SEED=1 is explicitly set.
    preDeployCommand: cd apps/api && node scripts/deploy-migrations.mjs && npx prisma db seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: WEATHER_PROVIDER
        value: mock
      - key: AI_PROVIDER
        value: offline
      - key: PAYMENT_PROVIDER
        value: sandbox
      # Explicit operator sign-off to boot production on the placeholder
      # providers above (mock weather / offline AI / sandbox SMS). Without it
      # the fail-fast in env.ts aborts startup (see Phase 4 gate).
      - key: ALLOW_PLACEHOLDER_PROVIDERS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: agrobridge-db
          property: connectionString
      # NOTE: the API reads WEB_ORIGIN (see apps/api/src/config/env.ts); the
      # Capacitor WebView (androidScheme "https") sends Origin: https://localhost.
      # WARNING: this service was originally created via dashboard, so keep
      # this value in sync with the dashboard's WEB_ORIGIN setting.
      - key: WEB_ORIGIN
        value: https://agrobridge-web.vercel.app,https://agrobridge-vfbz.onrender.com,https://localhost,capacitor://localhost,http://localhost
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
