services:
  - type: postgresql
    name: agrobridge-db
    plan: free
    region: oregon
    databaseName: agrobridge
    user: agrobridge
    version: "16"

  - type: web_service
    name: agrobridge-api
    plan: free
    region: oregon
    repo: https://github.com/tanviruchahs2580/AgroBridge
    branch: main
    rootDir: apps/api
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: WEATHER_PROVIDER
        value: mock
      - key: AI_PROVIDER
        value: offline
      - key: PAYMENT_PROVIDER
        value: sandbox
      - key: DATABASE_URL
        fromDatabase:
          name: agrobridge-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://agrobridge-web.vercel.app
      # JWT secrets - generate manually in Render dashboard after first deploy
      - key: JWT_ACCESS_SECRET
        value: CHANGE_ME_REPLACE_WITH_64_CHAR_RANDOM
      - key: JWT_REFRESH_SECRET
        value: CHANGE_ME_REPLACE_WITH_64_CHAR_RANDOM