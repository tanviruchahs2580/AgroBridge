services:
  - type: postgresql
    name: agrobridge-db
    plan: free
    region: oregon
    databaseName: agrobridge
    user: agrobridge
    version: "16"

  - type: web_service
    name: agrobridge-api-node
    plan: free
    region: oregon
    repo: https://github.com/tanviruchahs2580/AgroBridge
    branch: main
    buildCommand: npm install --include=dev && sed -i s/sqlite/postgresql/ apps/api/prisma/schema.prisma && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build --workspace apps/api
    startCommand: node apps/api/dist/server.js
    preDeployCommand: cd apps/api && npx prisma db push && npx prisma db seed
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: WEATHER_PROVIDER
        value: mock
      - key: AI_PROVIDER
        value: offline
      - key: PAYMENT_PROVIDER
        value: sandbox
      - key: DATABASE_URL
        fromDatabase:
          name: agrobridge-db
          property: connectionString
      # NOTE: the API reads WEB_ORIGIN (see apps/api/src/config/env.ts); the
      # Capacitor WebView (androidScheme "https") sends Origin: https://localhost.
      # WARNING: this service was originally created via dashboard, so keep
      # this value in sync with the dashboard's WEB_ORIGIN setting.
      - key: WEB_ORIGIN
        value: https://agrobridge-web.vercel.app,https://agrobridge-vfbz.onrender.com,https://localhost,capacitor://localhost,http://localhost,http://10.23.41.26:8080
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
