# Single source for the web tier's security headers.
#
# Included by BOTH nginx configs (docker/web.nginx.prod.conf for the VM stack,
# docker/web.nginx.conf for the local stack). Two reasons it is an include and
# not a block copied into each server/location:
#
#   1. nginx inherits server-level `add_header` directives ONLY into a location
#      that declares none of its own. A location that adds Cache-Control
#      therefore drops every security header above it — the exact defect the
#      2026-11-10 audit found in docker/web.nginx.conf (F-87). Including the
#      same file in the server block and in every location that needs its own
#      add_header makes that drift impossible.
#   2. Both files are baked into / mounted into the same image
#      (docker/web.Dockerfile copies this file to /etc/nginx/snippets/), so the
#      include path is identical in both.
#
# Strict-Transport-Security is part of the shared set so no location can drop
# it. On the local stack, which serves plain HTTP on :8080, it is inert —
# browsers honour HSTS only over TLS — and no user-facing traffic reaches that
# stack. The production stack serves it on 443, where it takes effect.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# no-referrer, matching the documented edge policy (docs/deployment.md §7) and
# the API. The dead config this replaces sent strict-origin-when-cross-origin.
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# camera=(self) keeps the <input capture> disease-photo intake working; the app
# declares no geolocation permission.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
# NOTE: no Content-Security-Policy here on purpose. The app's CSP allowlists the
# inline theme-boot script by sha256 hash, which apps/web/scripts/preflight.mjs
# recomputes from the built HTML for the Vercel configs; a static hash in this
# file would break the app on the next build that touches that script. Serving
# the SPA from this stack therefore ships a weaker policy than the Vercel edge —
# tracked as a gap, not presented as parity.
