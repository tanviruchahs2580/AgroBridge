# Local stack nginx for the AgroBridge SPA: HTTP only, no TLS, no caching
# policy worth speaking of. Not a deployment file.
#
# docker-compose.yml mounts this file read-only at
# /etc/nginx/conf.d/default.conf (the image bakes docker/web.nginx.prod.conf,
# which is what the VM stack uses). Until 2026-11-10 nothing mounted this file
# and docs/deployment.md §4 pointed a reader at it: dead config that contradicted
# the shipped one (strict-origin-when-cross-origin instead of no-referrer, no
# permissions policy) and whose asset location silently dropped every inherited
# security header, because a location-level add_header cancels the server-level
# set (F-87). It is live config again — and deliberately minimal so it cannot
# drift: the header set is one included file, and no location below declares its
# own add_header.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/plain;

  # /api/v1/health → API root /health (healthcheck is mounted on the Express root)
  location = /api/v1/health {
    proxy_pass http://api:4000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
  }

  # SPA fallback for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
