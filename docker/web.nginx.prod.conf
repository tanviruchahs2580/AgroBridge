# AgroBridge production nginx — TLS termination + SPA + API reverse proxy.
# Mounted over the built-in conf by docker-compose.prod.yml:
#   ./docker/web.nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
# Operator action: replace every DOMAIN token below with your real domain
# (cert path directory = first label-safe form of the domain, e.g. /etc/letsencrypt/live/app.example.com/).
# Single trusted hop: do NOT enable ngx_http_realip_module — the API trusts X-Forwarded-For as set here.

# Preserve upstream X-Request-Id when present; otherwise let nginx generate one.
map $http_x_request_id $ab_request_id {
  ""      $request_id;
  default $http_x_request_id;
}

# HTTP -> HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name DOMAIN;

  # ACME HTTP-01 challenge stays on plain HTTP (certbot webroot)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name DOMAIN;

  ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

  # HSTS — only enable once TLS is confirmed stable for this domain
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Security headers (helmet-equivalent at the edge)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(self), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://sandbox.sslcommerz.com https://securepay.sslcommerz.com; frame-ancestors 'none'" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css image/svg+xml;

  # Disease-photo uploads travel through this proxy (8MB image cap + headroom)
  client_max_body_size 16m;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $ab_request_id;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  # Vite content-hashed assets — cache hard.
  # NOTE: add_header inside a location suppresses inherited server-level headers,
  # so the security headers are repeated here.
  location /assets/ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
