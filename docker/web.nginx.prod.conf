# Production nginx for the AgroBridge SPA (the VM/compose stack).
#
# Baked into the web image by docker/web.Dockerfile and mounted read-only at
# /etc/nginx/conf.d/default.conf by docker-compose.prod.yml, which also mounts
# the TLS material at /etc/nginx/tls (host directory from TLS_CERTS_DIR).
#
# Until 2026-11-10 this file had a single `listen 80` server and no
# `ssl_certificate` anywhere in the repository, while compose published 443 —
# so https://host was connection-refused, users fell back to cleartext HTTP,
# and the Strict-Transport-Security header above it was inert on the HTTP
# response it shipped with (F-87). TLS terminates here now, and the cleartext
# listener does nothing but redirect.
#
# Caching mirrors the Vercel edge policy (docs/deployment.md §7): hashed assets
# immutable for a year, non-hashed static directories a week with background
# refresh, and the document / version.json / sw.js left revalidating so a client
# can never be pinned to a stale bundle.

server {
  # Port 80: ACME renewals and the redirect. No content is served in the clear.
  listen 80 default_server;
  server_name _;

  # The container healthcheck (docker-compose.prod.yml) must not follow the
  # redirect: over the loopback name an https:// request would fail the
  # certificate check for a perfectly healthy service.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # certbot --webroot renewals: mount the host's webroot here to renew without
  # stopping the stack (see docs/deployment.md §5). Empty by default.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  include /etc/nginx/snippets/security-headers.conf;

  # Text assets are the bulk of the bytes on the connections this app targets.
  # gzip was absent from every nginx config in the repo until now (F-87).
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/plain;

  # /api/v1/health → API root /health (healthcheck is mounted on Express root, not under /api/v1)
  location = /api/v1/health {
    proxy_pass http://api:4000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Reverse-proxy API (same-origin on the browser; no CORS needed)
  # /api/v1/ paths are forwarded intact to the Express /api/v1 sub-router.
  # /health is mounted directly on the Express root, so it needs a separate location.
  location /health {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite content-hashes every name under /assets, so the bytes at a URL never
  # change: immutable, exactly like the Vercel rule.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Not hash-named, so a week with background refresh (the Vercel rule).
  location ~* ^/(fonts|icons|images|brand)/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    try_files $uri =404;
  }

  # The shell and the release stamp must revalidate, or a client keeps an
  # old index.html and never learns about a new bundle.
  location = /version.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # SPA fallback for client-side routes. The document revalidates.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
