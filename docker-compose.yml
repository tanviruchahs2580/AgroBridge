# Local/production-like composition. For real deployments use a managed
# PostgreSQL instance and set secrets via your platform's secret manager.
services:
  db:
    # Digest-pinned (tag kept for humans): "postgres:16-alpine" is mutable and a
    # retag would change the local stack silently. Still 16 while CI/prod run 17
    # — a pgdata volume written by 16 cannot be opened by 17, so the bump needs
    # a volume migration, not a tag edit.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: agrobridge
      POSTGRES_USER: ${POSTGRES_USER:-agrobridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Optional second role for the app connection (see docker/postgres-init/).
      # Empty means the app role is created without LOGIN; set it before the
      # first start to give the role a password.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First-start-only role/grant setup. Postgres runs these files exactly once,
      # against the empty database of a fresh pgdata volume.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrobridge} -d agrobridge"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # /ready is the api's healthcheck and it needs the db; without this the api
    # container could start against a not-yet-ready database and only recover
    # by luck of request ordering.
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      # NOTE: production uses the postgres schema variant (see docs/deployment.md)
      DATABASE_URL: ${API_DATABASE_URL:?set API_DATABASE_URL}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-mock}
      AI_PROVIDER: ${AI_PROVIDER:-offline}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sandbox}
      SMS_PROVIDER: ${SMS_PROVIDER:-sandbox}
      # DEV-ONLY bypass of the production placeholder guard (env.ts fail-fast).
      # Never set this on a real deployment; prod compose must not include it.
      ALLOW_PLACEHOLDER_PROVIDERS: "1"
      # DEV-ONLY: this stack is NODE_ENV=production but the web UI is served
      # from http://localhost:8080, which the production CORS filter would drop.
      # Never set on a real deployment.
      ALLOW_DEV_ORIGINS: "1"
    ports:
      - "4000:4000"
    # Readiness, not liveness (H-09): /ready additionally proves the DB answers
    # (`SELECT 1`) and reports the applied schema state, so anything waiting on
    # "healthy" — including the web service below via depends_on — waits for a
    # serve-capable API, not merely a running process. /health remains the
    # liveness probe for process supervision (see docs/deployment.md).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/ready"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

  # Observability is opt-in: `docker compose --profile monitoring up -d`.
  # The default stack stays db + api + web, so a laptop does not pay for two
  # more containers unless asked. prometheus.yml scrapes `api:4000/metrics` on
  # this compose network and loads alert_rules.yml from the same mount; the
  # Grafana dashboard JSON is imported from ./monitoring by hand until
  # provisioning files exist.
  prometheus:
    # prom/prometheus:v3.15.0
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: ["monitoring"]
    volumes:
      - ./monitoring:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    # grafana/grafana:13.2.4 — local login stays at the image defaults, so this
    # profile is for a developer machine, never a deployment.
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    profiles: ["monitoring"]
    volumes:
      - ./monitoring:/monitoring:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafanadata:
