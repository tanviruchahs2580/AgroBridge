# Local/production-like composition. For real deployments use a managed
# PostgreSQL instance and set secrets via your platform's secret manager.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agrobridge
      POSTGRES_USER: ${POSTGRES_USER:-agrobridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrobridge} -d agrobridge"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4000"
      # NOTE: production uses the postgres schema variant (see docs/deployment.md)
      DATABASE_URL: ${API_DATABASE_URL:?set API_DATABASE_URL}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-mock}
      AI_PROVIDER: ${AI_PROVIDER:-offline}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sandbox}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # DEV ONLY — production (docker-compose.prod.yml) keeps api on the
      # internal network and never publishes 4000 (nginx bridges edge→internal).
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
